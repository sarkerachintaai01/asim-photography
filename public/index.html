<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asim Photography | অসীম ফটোগ্রাফি – ওয়েডিং, সিনেমাটোগ্রাফি ও ড্রোন, কুষ্টিয়া</title>
<meta name="description" content="Asim Photography, Khoksa, Kushtia – Wedding photography, cinematography and drone service. Booking open 2026. Call/WhatsApp 01723-515007. অসীম ফটোগ্রাফি – ওয়েডিং ফটোগ্রাফি, সিনেমাটোগ্রাফি ও ড্রোন সার্ভিস।">
<meta property="og:title" content="Asim Photography – Capturing Emotions Cinematically">
<meta property="og:description" content="Wedding photography, cinematography and drone service in Kushtia, Bangladesh.">
<meta property="og:image" content="/assets/banner.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/assets/logo.jpg">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Photographer","name":"Asim Photography","telephone":"+8801723515007","email":"asimphotography.khk@gmail.com","address":{"@type":"PostalAddress","addressLocality":"Khoksa, Kushtia","addressCountry":"BD"},"sameAs":["https://www.facebook.com/asimphotography.khoksa","https://www.youtube.com/@AsimPhotography007"]}</script>
<style>
:root{--bg:#0a0a0a;--card:#151312;--gold:#d4a55a;--rose:#e0b4a0;--text:#f2ece4;--mute:#a89f94;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Noto Serif Bengali","Kalpurush","Nirmala UI",serif;line-height:1.65}
a{color:inherit;text-decoration:none}img{max-width:100%}
header{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1a1206,#4a3512 50%,#1a1206);border-bottom:2px solid var(--gold);display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:10px;flex-wrap:wrap}
header img{height:56px;width:auto;border-radius:10px;border:2px solid var(--gold);background:#000;box-shadow:0 0 14px rgba(212,165,90,.6)}
nav{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}nav a:hover{color:var(--gold)}
.lang{border:1px solid var(--gold);background:none;color:var(--gold);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px}
.hero img{width:100%;display:block}.cta{text-align:center;padding:22px 16px}
.btn{display:inline-block;background:linear-gradient(135deg,#e6bb72,#b9853a);color:#111;padding:12px 26px;border-radius:30px;font-weight:bold;margin:6px;border:0;cursor:pointer;font-family:inherit;font-size:16px}
.btn.o{background:none;border:1px solid var(--gold);color:var(--gold)}
section{padding:46px 16px;max-width:1080px;margin:auto}
h2{color:var(--gold);text-align:center;font-weight:normal;letter-spacing:1px;margin:0 0 8px;font-size:28px}
.sub{text-align:center;color:var(--mute);margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid #2a2318;border-radius:12px;padding:18px}
.card h3{color:var(--rose);margin:6px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.tabs button{background:none;border:1px solid #3a2d1a;color:var(--text);padding:7px 16px;border-radius:20px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--gold);color:#111}
.gp{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid #3a2d1a;cursor:zoom-in;transition:transform .3s,box-shadow .3s;box-shadow:0 4px 18px rgba(0,0,0,.6)}
.gp:hover{transform:scale(1.03);box-shadow:0 6px 26px rgba(212,165,90,.45)}
.ob{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.price{color:var(--gold);font-size:24px;margin:6px 0}.price.q{font-size:16px;color:var(--mute)}
.tag{background:#b9853a;color:#111;font-size:12px;padding:2px 10px;border-radius:10px;margin-left:6px;vertical-align:middle}
.ph{padding:30px;text-align:center;color:var(--mute);grid-column:1/-1}
.about{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:22px;align-items:center}
@media(max-width:640px){.about{grid-template-columns:1fr}}
.about img{width:100%;border-radius:12px;border:2px solid var(--gold)}
.yt{background:linear-gradient(135deg,#2a0d0d,#111)}.fb{background:linear-gradient(135deg,#0d1a2a,#111)}
.ct{text-align:center}.ct p{margin:8px 0}
iframe{width:100%;height:300px;border:0;border-radius:12px;margin-top:14px}
footer{text-align:center;color:var(--mute);padding:28px 16px 90px;border-top:1px solid #2a2318;font-size:14px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:30px;padding:12px 18px;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:30}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lb img{max-width:96vw;max-height:92vh;border-radius:8px}
</style>
</head>
<body>
<header>
<a href="#home"><img src="/assets/logo-header.jpg" alt="Asim Photography"></a>
<nav id="nav"></nav>
<button class="lang" id="lb2"></button>
</header>
<div class="hero" id="home"><img id="heroimg" src="/assets/banner.jpg" alt="Asim Photography – Capturing Emotions Cinematically"><div class="cta" id="cta"></div></div>
<section id="services"></section>
<section id="portfolio"></section>
<section id="offers"></section>
<section id="about"></section>
<section id="social"></section>
<section id="contact"></section>
<footer id="foot"></footer>
<a class="wa" id="wa" target="_blank" rel="noopener">WhatsApp</a>
<div id="lb" onclick="this.style.display='none'"><img alt=""></div>
<script>
var L=localStorage.getItem("lang")||"bn",D=null,cur="all";
var T={home:["হোম","Home"],portfolio:["পোর্টফোলিও","Portfolio"],offers:["হায়ার মি / অফার","Hire Me / Offers"],about:["আমার সম্পর্কে","About Me"],contact:["যোগাযোগ","Contact"],
book:["বুক করুন","Book Now"],call:["কল করুন","Call Now"],wab:["WhatsApp-এ বুক করুন","Book on WhatsApp"],all:["সব","All"],
sv:["আমাদের সেবা","Our Services"],tag:["আবেগকে ধরে রাখি সিনেমাটিক ঢঙে","Capturing Emotions Cinematically"],
s1:["ওয়েডিং ফটোগ্রাফি","Wedding Photography"],s1d:["আপনার বিশেষ দিনের প্রতিটি মুহূর্ত।","Every moment of your special day."],
s2:["সিনেমাটোগ্রাফি","Cinematography"],s2d:["সিনেমার মতো ভিডিও গল্প।","Video stories that feel like cinema."],
s3:["ড্রোন সার্ভিস","Drone Service"],s3d:["আকাশ থেকে অসাধারণ দৃশ্য।","Stunning views from the sky."],
pf:["আমার কাজ","My Work"],soon:["এই ক্যাটাগরিতে ছবি শীঘ্রই যোগ হবে","Photos coming soon in this category"],
of:["বুকিং চলছে ২০২৬ — আপনার প্যাকেজ বেছে নিন","Booking Open 2026 — choose your package"],qp:["মূল্য জানতে যোগাযোগ করুন","Contact for price"],
yt:["আমাদের ভিডিও ও সিনেমাটিক কাজ দেখুন","Watch our videos and cinematic work"],ytb:["YouTube চ্যানেল দেখুন","Visit YouTube Channel"],
fb:["নতুন কাজ ও অফারের খবর পেতে","Get news of new work and offers"],fbb:["Facebook-এ ফলো করুন","Follow on Facebook"],rights:["সর্বস্বত্ব সংরক্ষিত","All rights reserved"]};
function t(k){return T[k][L==="bn"?0:1]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function pick(o,k){return o[k+"_"+L]||o[k+"_bn"]||""}
function safeUrl(u){return /^https?:\/\//.test(u)?u:"#"}
function draw(){
  var S=D.site,wa="https://wa.me/"+String(S.whatsapp).replace(/\D/g,"");
  document.documentElement.lang=L;
  document.getElementById("lb2").textContent=L==="bn"?"English":"বাংলা";
  document.getElementById("nav").innerHTML=[["home","home"],["portfolio","portfolio"],["offers","offers"],["about","about"],["contact","contact"]].map(function(a){return '<a href="#'+a[0]+'">'+t(a[1])+'</a>'}).join("");
  document.getElementById("heroimg").src=D.hero.img||"/assets/banner.jpg";
  document.getElementById("cta").innerHTML='<a class="btn" href="#offers">'+t("book")+'</a><a class="btn o" href="tel:'+esc(S.phone)+'">'+t("call")+': '+esc(S.phone)+'</a>';
  document.getElementById("wa").href=wa;
  document.getElementById("services").innerHTML='<h2>'+t("sv")+'</h2><p class="sub">'+t("tag")+'</p><div class="grid">'+[1,2,3].map(function(i){return '<div class="card"><h3>'+t("s"+i)+'</h3><p>'+t("s"+i+"d")+'</p></div>'}).join("")+'</div>';
  var tabs='<button class="'+(cur==="all"?"on":"")+'" data-c="all">'+t("all")+'</button>'+D.cats.map(function(c){return '<button class="'+(cur===c.id?"on":"")+'" data-c="'+esc(c.id)+'">'+esc(pick(c,"")||c[L])+'</button>'}).join("");
  var ph=D.photos.filter(function(p){return cur==="all"||p.cat===cur});
  document.getElementById("portfolio").innerHTML='<h2>'+t("pf")+'</h2><p class="sub"></p><div class="tabs">'+tabs+'</div><div class="grid">'+(ph.length?ph.map(function(p){return '<img class="gp" loading="lazy" src="'+esc(p.src)+'" alt="Asim Photography">'}).join(""):'<div class="ph">'+t("soon")+'</div>')+'</div>';
  var of=D.offers.filter(function(o){return !o.hidden});
  document.getElementById("offers").innerHTML='<h2>'+t("offers")+'</h2><p class="sub">'+t("of")+'</p><div class="grid">'+of.map(function(o){
    var tg=pick(o,"tag");
    return '<div class="card">'+(o.img?'<img class="ob" loading="lazy" src="'+esc(o.img)+'" alt="'+esc(pick(o,"title"))+'">':'')+'<h3>'+esc(pick(o,"title"))+(tg?'<span class="tag">'+esc(tg)+'</span>':'')+'</h3>'+(o.hidePrice?'<div class="price q">'+t("qp")+'</div>':'<div class="price">'+esc(o.price)+'</div>')+'<p>'+esc(pick(o,"desc"))+'</p><a class="btn" target="_blank" rel="noopener" href="'+wa+'?text='+encodeURIComponent(pick(o,"title"))+'">'+t("wab")+'</a><a class="btn o" href="tel:'+esc(S.phone)+'">'+t("call")+'</a></div>'}).join("")+'</div>';
  document.getElementById("about").innerHTML='<h2>'+t("about")+'</h2><p class="sub"></p><div class="about">'+(D.about.photo?'<img src="'+esc(D.about.photo)+'" alt="Asim">':'<span></span>')+'<div><p>'+esc(D.about[L]).replace(/\n/g,"<br>")+'</p></div></div>';
  document.getElementById("social").innerHTML='<div class="grid"><div class="card yt"><h3>YouTube</h3><p>'+t("yt")+'</p><a class="btn" target="_blank" rel="noopener" href="'+esc(safeUrl(S.youtube))+'">'+t("ytb")+'</a></div><div class="card fb"><h3>Facebook</h3><p>'+t("fb")+'</p><a class="btn" target="_blank" rel="noopener" href="'+esc(safeUrl(S.facebook))+'">'+t("fbb")+'</a></div></div>';
  document.getElementById("contact").innerHTML='<h2>'+t("contact")+'</h2><p class="sub"></p><div class="card ct"><p>📍 '+esc(L==="bn"?S.address_bn:S.address_en)+'</p><p>📞 <a href="tel:'+esc(S.phone)+'">'+esc(S.phone)+'</a></p><p>✉️ <a href="mailto:'+esc(S.email)+'">'+esc(S.email)+'</a></p><p><a class="btn" target="_blank" rel="noopener" href="'+wa+'">WhatsApp</a></p>'+(/^https:\/\/www\.google\.com\/maps\/embed/.test(S.map||"")?'<iframe loading="lazy" src="'+esc(S.map)+'" title="Map"></iframe>':'')+'</div>';
  document.getElementById("foot").innerHTML='© 2026 Asim Photography — '+t("rights");
}
document.addEventListener("click",function(e){
  var c=e.target.closest(".tabs button");if(c){cur=c.getAttribute("data-c");draw();return}
  if(e.target.classList.contains("gp")){var b=document.getElementById("lb");b.firstElementChild.src=e.target.src;b.style.display="flex"}
});
document.getElementById("lb2").onclick=function(){L=L==="bn"?"en":"bn";try{localStorage.setItem("lang",L)}catch(x){}draw()};
function get(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
get("/api/content").catch(function(){return get("/default.json")}).then(function(d){D=d;draw()});
</script>
</body>
</html>
